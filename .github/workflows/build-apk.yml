name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Si la compilación falla, copia las líneas importantes del error a las anotaciones
      # del job, que se pueden leer sin iniciar sesión.
      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not|Execution failed|AAPT|incompatible" build.log | head -15 | sed 's/^/::error::/' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaoVT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
