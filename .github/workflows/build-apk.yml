name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Si la compilación falla, deja el motivo completo en una sola anotación del job
      # (GitHub la muestra sin iniciar sesión).
      - name: Mostrar errores
        if: failure()
        run: |
          msg=$(grep -A 18 "What went wrong" build.log | head -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g') || true
          echo "::error title=Motivo del fallo de Gradle::$msg"
          grep -E "^e: " build.log | head -5 | sed 's/^/::error::/' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaoVT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
